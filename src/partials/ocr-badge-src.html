<!-- OCR confidence badge for sources -->
<!-- Params: sourceRef, badgeClass, wrapperClass, gapClass -->
<!-- Bouton focusable : toggle au clic/Enter (tactile + clavier), hover conservé (souris). -->
<template x-if="{{sourceRef}}.ocrConfidence">
  <button
    type="button"
    class="inline-block {{wrapperClass}} focus-ring rounded-badge"
    @click.stop="toggleOcrPopover($el, {{sourceRef}})"
    @keydown.enter.stop.prevent="toggleOcrPopover($el, {{sourceRef}})"
    @mouseenter="showOcrPopover($el, {{sourceRef}})"
    @mouseleave="hideMetaPopover()"
    @blur="hideMetaPopover()"
    :aria-expanded="_metaPopoverAnchor === $el && !!_metaPopoverPos ? 'true' : 'false'"
    aria-describedby="meta-popover"
    :aria-label="t('ocr.confidence')"
  >
    <span
      class="source-meta-pill {{badgeClass}} {{gapClass}} cursor-pointer"
      :class="ocrConfidenceColor({{sourceRef}})"
    >
      <i :data-lucide="ocrConfidenceIcon({{sourceRef}})" class="w-3 h-3"></i>
      <span x-text="ocrConfidencePercent({{sourceRef}})">OCR</span>
    </span>
  </button>
</template>

<!-- ======================== DICTÉE ======================== -->
<div x-show="activeView === 'dictation'">
  <div class="flex items-center justify-between mb-4">
    <!-- NOSONAR(S5254) — Alpine.js x-text fills heading content at runtime -->
    <h2 class="font-heading font-bold text-xl title-gradient" x-text="t('dictation.heading')">
      Dictée
    </h2>
    <button
      @click="generate('dictation')"
      :disabled="sources.length === 0"
      class="px-4 min-h-touch rounded-button font-semibold text-body-sm flex items-center gap-2 btn-lift focus-ring bg-gen-dictation/10 text-gen-dictation-deep hover:bg-gen-dictation/20 disabled:opacity-50"
    >
      <i data-lucide="plus" class="w-4 h-4"></i>
      <span x-text="t('dictation.new')"></span>
    </button>
  </div>

  <!-- Empty state -->
  <div
    x-show="generationsByType('dictation').length === 0 && !isLoading('dictation')"
    class="text-center py-12"
  >
    <div
      class="w-16 h-16 mx-auto mb-3 bg-gen-dictation/10 rounded-[1rem] border border-gen-dictation/20 flex items-center justify-center"
    >
      <i data-lucide="spell-check" class="w-8 h-8 text-gen-dictation-deep"></i>
    </div>
    <p class="text-text-primary font-semibold mb-1" x-text="t('dictation.emptyTitle')"></p>
    <p
      class="text-text-secondary text-body-sm mb-4"
      x-text="sources.length === 0 ? t('common.noSourcesYet') : t('dictation.emptyWithSources')"
    ></p>
    <button
      x-show="sources.length === 0"
      @click="goToView('sources')"
      class="bg-accent text-text-inverted px-5 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring"
      x-text="t('common.addSources')"
    ></button>
  </div>

  <!-- Generation list -->
  <div class="space-y-3">
    <template x-for="gen in generationsByType('dictation')" :key="gen.id">
      <div class="gen-card animate-slide-up">
        {{> gen-card-header icon="spell-check" chipClass="icon-chip-dictation"
        colorClass="gen-dictation" hasScore=true}}

        <!-- Expanded content -->
        <div x-show="openGens[gen.id]" x-transition class="px-4 pb-4 border-t border-gray-100">
          <!-- Interactive step-by-step dictation -->
          <div
            x-data="dictationComponent(gen)"
            x-init="$watch('openGens', () => { if (!openGens[gen.id]) stopWord() })"
          >
            <!-- Lecteur du mot courant (caché : piloté par les boutons) -->
            <audio
              x-ref="wordAudio"
              :src="audioUrl()"
              preload="metadata"
              class="hidden"
              @ended="onAudioEnded()"
            ></audio>

            <!-- Attempt history -->
            <div
              x-show="gen.stats && gen.stats.attempts.length > 0"
              class="mb-4 flex flex-wrap gap-2"
            >
              <template x-for="(att, ai) in (gen.stats?.attempts || [])" :key="ai">
                <span
                  class="text-sm px-2.5 py-1 rounded-badge font-semibold"
                  :class="att.score === att.total ? 'bg-success-light text-success-dark' : 'bg-gray-100 text-text-secondary'"
                  x-text="'T' + (ai+1) + ': ' + att.score + '/' + att.total"
                ></span>
              </template>
            </div>

            <!-- Active word (step-by-step) -->
            <template x-if="!finished">
              <div>
                {{> step-progress-nav colorClass="gen-dictation"}}
                <!-- Progress bar -->
                <div class="h-2 rounded-full bg-gray-200 mb-4">
                  <div
                    class="h-2 rounded-full bg-gen-dictation transition-all duration-500"
                    :style="'width:' + progress() + '%'"
                  ></div>
                </div>

                <!-- Word card -->
                <div class="bg-gray-50 rounded-card p-5 mb-4">
                  <div class="flex items-center gap-2 mb-3">
                    <span
                      class="text-xs text-text-secondary"
                      x-text="'#' + (currentIndex() + 1)"
                    ></span>
                  </div>

                  <!-- Écouter le mot -->
                  <div class="flex flex-wrap items-center gap-2 mb-4">
                    <button
                      @click="playWord()"
                      class="bg-gen-dictation-deep text-text-inverted px-4 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring inline-flex items-center gap-2"
                    >
                      <i data-lucide="volume-2" class="w-4 h-4"></i>
                      <span
                        x-text="feedback ? t('dictation.replay') : t('dictation.playWord')"
                      ></span>
                    </button>
                  </div>

                  <!-- Phrase-exemple À TROU avant validation (le mot masqué),
                       phrase complète après -->
                  <p
                    x-show="feedback || maskedSentence()"
                    class="text-lg text-text-primary leading-relaxed mb-4 italic"
                    x-text="feedback ? currentWord()?.sentence : maskedSentence()"
                  ></p>

                  <!-- Saisie -->
                  <input
                    type="text"
                    x-ref="dictationInput"
                    x-model="typed"
                    :aria-label="t('a11y.dictationAnswer')"
                    :disabled="!!feedback"
                    @keydown="handleKey($event)"
                    :placeholder="t('dictation.placeholder')"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                    class="w-full sm:w-72 min-h-touch text-center text-lg font-semibold border-b-2 bg-transparent rounded-t-lg px-2 py-1 focus-ring transition-colors"
                    :class="{
                      'border-success bg-success-light/50 text-success-dark': feedback?.correct,
                      'border-danger bg-danger-light/50 text-danger-dark': feedback && !feedback.correct,
                      'border-gen-dictation focus:border-gen-dictation': !feedback
                    }"
                  />
                </div>

                <!-- Check button -->
                <div x-show="!feedback && !isCurrentAnswered()" class="text-center">
                  <button
                    @click="checkAnswer()"
                    :disabled="!typed.trim()"
                    class="bg-gen-dictation-deep text-text-inverted px-6 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring inline-flex items-center gap-2 disabled:opacity-50"
                  >
                    <i data-lucide="check-circle" class="w-5 h-5"></i>
                    <span x-text="t('step.check')"></span>
                  </button>
                </div>

                <!-- Feedback -->
                <div x-show="feedback" x-transition class="mt-2">
                  <div
                    class="p-4 rounded-card"
                    :class="feedback?.correct
                      ? 'bg-success-light border-2 border-success animate-correct'
                      : 'bg-danger-light border-2 border-danger animate-wrong'"
                  >
                    <p
                      class="font-heading font-bold text-body-sm"
                      :class="feedback?.correct ? 'text-success-dark' : 'text-danger-dark'"
                      x-text="feedback?.correct ? t('quiz.correct') : t('quiz.incorrect')"
                    ></p>

                    <!-- Diff caractère par caractère de la saisie -->
                    <p x-show="feedback && !feedback.correct" class="text-lg font-semibold mt-1">
                      <template x-for="(c, ci) in (feedback?.chars || [])" :key="ci">
                        <span
                          :class="c.ok ? 'text-success-dark' : 'text-danger-dark underline decoration-2'"
                          x-text="c.ch"
                        ></span>
                      </template>
                    </p>
                    <p
                      x-show="feedback && !feedback.correct"
                      class="text-body-sm mt-1 text-danger-dark"
                      x-text="t('dictation.correctSpelling', { word: feedback?.expected || '' })"
                    ></p>

                    <!-- Règle d'orthographe (sur erreur) -->
                    <p
                      x-show="feedback && !feedback.correct && currentWord()?.rule"
                      class="text-body-sm mt-2 pt-2 border-t border-current/10 flex items-start gap-1.5"
                    >
                      <i data-lucide="lightbulb" class="w-4 h-4 shrink-0 mt-0.5"></i>
                      <span x-text="currentWord()?.rule"></span>
                    </p>
                  </div>
                  <div x-show="!isReviewing()" class="text-center mt-3">
                    <button
                      @click="nextQuestion()"
                      class="bg-primary-dark text-text-inverted px-5 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring inline-flex items-center gap-2"
                    >
                      <span x-text="t('step.next')"></span>
                      <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              </div>
            </template>

            <!-- Finished screen -->
            <template x-if="finished">
              <div class="text-center py-8">
                <div
                  class="inline-block px-8 py-4 rounded-card mb-4"
                  :class="score === items().length ? 'bg-success-light' : 'bg-warning-light'"
                >
                  <p
                    class="font-heading font-bold text-3xl"
                    :class="score === items().length ? 'text-success-dark' : 'text-warning-dark'"
                    x-text="score + '/' + items().length"
                  ></p>
                  <p
                    class="text-body-sm font-medium mt-1"
                    :class="score === items().length ? 'text-success-dark' : 'text-warning-dark'"
                    x-text="score === items().length ? t('dictation.perfect') : t('dictation.keepGoing')"
                  ></p>
                </div>
                <div class="flex gap-3 justify-center flex-wrap">
                  <button
                    x-show="score < items().length"
                    @click="retryWrongWords()"
                    class="bg-warning-dark text-text-inverted px-5 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring"
                    x-text="t('step.retryWrong')"
                  ></button>
                  <button
                    @click="resetDictation()"
                    class="bg-gray-200 text-text-primary px-5 min-h-touch rounded-button font-semibold text-body-sm btn-press focus-ring"
                    x-text="t('dictation.restart')"
                  ></button>
                </div>
              </div>
            </template>

            {{> gen-source-refs}}
          </div>
        </div>
      </div>
    </template>
  </div>
</div>

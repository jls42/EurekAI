<!-- Cost estimation badge for sources — popover rendered by global cost-popover.html.
     Bouton focusable : toggle au clic/Enter (tactile + clavier), hover conservé (souris). -->
<template x-if="src.estimatedCost != null">
  <button
    type="button"
    class="inline-block focus-ring rounded-badge"
    @click.stop="toggleCostPopover($el, src)"
    @keydown.enter.stop.prevent="toggleCostPopover($el, src)"
    @mouseenter="showCostPopover($el, src)"
    @mouseleave="hideMetaPopover()"
    @blur="hideMetaPopover()"
    :aria-expanded="_metaPopoverAnchor === $el && !!_metaPopoverPos ? 'true' : 'false'"
    aria-describedby="meta-popover"
    :aria-label="t('gen.estimatedCost')"
  >
    <span
      class="source-meta-pill {{badgeClass}} bg-accent/15 text-accent font-semibold cursor-pointer"
      x-text="t('gen.costPrefix') + ' ~$' + src.estimatedCost.toFixed(4)"
      >Est.</span
    >
  </button>
</template>

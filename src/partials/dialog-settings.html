<dialog
  x-ref="settingsDialog"
  class="rounded-dialog p-6 max-w-lg w-full max-h-[80vh] shadow-float glass"
>
  <div class="flex items-center justify-between mb-4">
    <h2 class="font-heading font-bold text-lg text-text-primary" x-text="t('settings.title')">
      Settings
    </h2>
    <!-- NOSONAR(S5254) — Alpine.js x-text fills heading content at runtime -->
    <button
      @click="closeSettingsDialog()"
      class="min-w-[44px] min-h-[44px] flex items-center justify-center text-text-secondary hover:text-text-primary focus-ring rounded-button"
      :aria-label="t('common.close')"
    >
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
  </div>
  <div class="overflow-y-auto max-h-[60vh] space-y-6">
    <div>
      <!-- NOSONAR(S5254) — Alpine.js x-text fills heading content at runtime -->
      <h3
        class="font-heading font-semibold text-sm text-text-secondary mb-2"
        x-text="t('settings.apiStatus')"
      >
        API Status
      </h3>
      <div class="flex gap-4">
        <span class="flex items-center gap-1.5 text-body-sm">
          <span
            class="w-3 h-3 rounded-full"
            :class="mistralReady() ? 'bg-success' : 'bg-danger'"
          ></span>
          Mistral
        </span>
      </div>
    </div>
    <div>
      <!-- NOSONAR(S5254) — Alpine.js x-text fills heading content at runtime -->
      <h3
        class="font-heading font-semibold text-sm text-text-secondary mb-2"
        x-text="t('apiKey.settingsTitle')"
      >
        Clé API Mistral
      </h3>
      <p
        class="text-body-sm mb-2"
        :class="hasMistralKey ? 'text-success' : 'text-text-secondary'"
        x-text="hasMistralKey ? t('apiKey.configured') : t('apiKey.notConfigured')"
      ></p>
      <div class="flex gap-2">
        <button
          @click="openApiKeyDialog('global')"
          class="rounded-button px-3 py-1.5 text-body-sm font-semibold bg-primary-dark text-text-inverted hover:bg-primary-dark/90 transition-colors btn-press focus-ring"
          x-text="hasMistralKey ? t('apiKey.change') : t('apiKey.configure')"
        ></button>
        <button
          x-show="hasMistralKey"
          @click="clearApiKey('global')"
          class="rounded-button px-3 py-1.5 text-body-sm font-semibold bg-gray-100 text-text-secondary hover:bg-gray-200 transition-colors btn-press focus-ring"
          x-text="t('apiKey.clearGlobal')"
        ></button>
      </div>
    </div>
    <div>
      <!-- NOSONAR(S5254) — Alpine.js x-text fills heading content at runtime -->
      <h3
        class="font-heading font-semibold text-sm text-text-secondary mb-2"
        x-text="t('settings.aiModels')"
      >
        AI Engines
      </h3>
      <div class="space-y-3">
        <div>
          <label
            for="cfg-main-model"
            class="text-sm text-text-secondary block mb-1"
            x-text="t('settings.aiModel')"
            >Generation</label
          >
          <select
            id="cfg-main-model"
            x-model="configDraft._mainModel"
            class="w-full input-modern px-3 py-2 text-body-sm"
          >
            <option
              value="mistral-large-latest"
              x-text="modelOptionLabel('mistral-large-latest') + ' · ' + t('settings.recommended')"
            >
              mistral-large-latest
            </option>
            <option value="mistral-large-4-0" x-text="modelOptionLabel('mistral-large-4-0')">
              mistral-large-4-0
            </option>
            <option
              value="mistral-medium-latest"
              x-text="modelOptionLabel('mistral-medium-latest')"
            >
              mistral-medium-latest
            </option>
            <option value="mistral-small-latest" x-text="modelOptionLabel('mistral-small-latest')">
              mistral-small-latest
            </option>
          </select>
          <p class="text-xs text-text-secondary mt-1" x-text="t('settings.aiModelHint')"></p>
        </div>
        <div>
          <label
            for="cfg-ocr-model"
            class="text-sm text-text-secondary block mb-1"
            x-text="t('settings.ocr')"
            >OCR</label
          >
          <select
            id="cfg-ocr-model"
            x-model="configDraft._ocrModel"
            class="w-full input-modern px-3 py-2 text-body-sm"
          >
            <option
              value="mistral-ocr-4-1"
              x-text="modelOptionLabel('mistral-ocr-4-1') + ' · ' + t('settings.recommended')"
            >
              OCR 4
            </option>
            <option value="mistral-ocr-2512" x-text="modelOptionLabel('mistral-ocr-2512')">
              OCR 3
            </option>
          </select>
          <p class="text-xs italic text-text-secondary mt-1" x-text="configDraft._ocrModel">
            mistral-ocr-4-1
          </p>
          <p class="text-xs text-text-secondary mt-1" x-text="t('settings.ocrHint')"></p>
        </div>
        <div>
          <label
            for="cfg-stt-model"
            class="text-sm text-text-secondary block mb-1"
            x-text="t('settings.stt')"
            >Transcription</label
          >
          <select
            id="cfg-stt-model"
            x-model="configDraft._sttModel"
            class="w-full input-modern px-3 py-2 text-body-sm"
          >
            <option
              value="voxtral-mini-2602"
              x-text="modelOptionLabel('voxtral-mini-2602') + ' · ' + t('settings.recommended')"
            >
              Mini Transcribe 2
            </option>
            <option
              value="voxtral-mini-transcribe-3-0"
              x-text="modelOptionLabel('voxtral-mini-transcribe-3-0')"
            >
              Mini Transcribe 3
            </option>
            <option
              value="voxtral-small-transcribe-3-0"
              x-text="modelOptionLabel('voxtral-small-transcribe-3-0')"
            >
              Small Transcribe 3
            </option>
          </select>
          <p class="text-xs italic text-text-secondary mt-1" x-text="configDraft._sttModel">
            voxtral-mini-2602
          </p>
          <p class="text-xs text-text-secondary mt-1" x-text="t('settings.sttHint')"></p>
        </div>
        <div>
          <label
            for="cfg-tts-model"
            class="text-sm text-text-secondary block mb-1"
            x-text="t('settings.tts')"
            >TTS</label
          >
          <select
            id="cfg-tts-model"
            x-model="configDraft.ttsModel"
            class="w-full input-modern px-3 py-2 text-body-sm"
          >
            <option
              value="voxtral-mini-tts-2603"
              x-text="modelOptionLabel('voxtral-mini-tts-2603') + ' · ' + t('settings.recommended')"
            >
              Voxtral TTS
            </option>
            <option value="voxtral-mini-tts-3-0" x-text="modelOptionLabel('voxtral-mini-tts-3-0')">
              Voxtral TTS 3
            </option>
          </select>
          <p class="text-xs italic text-text-secondary mt-1" x-text="configDraft.ttsModel">
            voxtral-mini-tts-2603
          </p>
          <p class="text-xs text-text-secondary mt-1" x-text="t('settings.ttsHint')"></p>
        </div>
      </div>
    </div>
  </div>
  <!-- Footer hors zone scrollable : Sauvegarder/Réinitialiser toujours atteignables -->
  <div class="flex gap-3 mt-4">
    <button
      @click="confirmAction(t('settings.resetConfirm'), t('common.reset'), () => resetSettings())"
      class="flex-1 min-h-touch rounded-button font-semibold text-body-sm transition-colors focus-ring border"
      style="border-color: var(--color-input-border); color: var(--color-text-secondary)"
      x-text="t('common.reset')"
    ></button>
    <button
      @click="saveSettings()"
      class="flex-1 bg-primary-dark text-text-inverted hover:bg-primary-dark/90 min-h-touch rounded-button font-semibold text-body-sm transition-colors card-lift btn-press focus-ring"
      x-text="t('common.save')"
    ></button>
  </div>
</dialog>

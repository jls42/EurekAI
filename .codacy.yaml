---
# Codacy configuration file.
# Doc: https://docs.codacy.com/repositories-configure/codacy-configuration-file/
#
# Pourquoi exclure src/**/*.test.ts du scan Codacy :
# Codacy applique tseslint.recommendedTypeChecked avec son propre tsconfig
# qui exclut src/. Résultat : `vi`, `vi.fn()`, `vi.spyOn()` sont résolus
# en `error` → cascade de @typescript-eslint/no-unsafe-* (50+ warnings sur
# cross-tab-sync.test.ts). Notre `projectService: true` dans eslint.config.js
# résout localement mais Codacy override sa propre config.
#
# Trade-off accepté : on garde le lint:ci local strict (--max-warnings 0)
# qui couvre ces fichiers, plus SonarCloud/SonarQube qui résolvent les types
# correctement. Le code prod (src/**/*.ts) reste scanné par Codacy.

exclude_paths:
  - 'src/**/*.test.ts'
  - 'coverage/**'
  - 'dist/**'
  - 'output/**'
